<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        const isDevPort =
          window.location.port === '5173' ||
          window.location.port === '4173';

        if (window.location.hostname !== '127.0.0.1' || !isDevPort) {
          return;
        }

        const nextUrl = new URL(window.location.href);
        nextUrl.hostname = 'localhost';
        window.location.replace(nextUrl.toString());
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Cal.com is loaded only after the booking action is requested. -->

    <link rel="dns-prefetch" href="https://vercel.com" />

    <!-- Primary Meta Tags -->
    <title>Jack Cao</title>

  <body>
    <div id="root"></div>
    <script>
      (function () {
        const cleanupKey = 'portfolio-service-worker-cleanup-v4';

        if (!('serviceWorker' in navigator)) {
          return;
        }

        try {
          if (window.sessionStorage.getItem(cleanupKey) === 'done') {
            return;
          }
        } catch (error) {
          console.warn('Unable to read sessionStorage during SW cleanup.', error);
        }

        navigator.serviceWorker
          .getRegistrations()
          .then(async (registrations) => {
            if (registrations.length === 0) {
              try {
                window.sessionStorage.setItem(cleanupKey, 'done');
              } catch (error) {
                console.warn('Unable to persist SW cleanup state.', error);
              }
              return;
            }

            await Promise.all(registrations.map((registration) => registration.unregister()));

            if ('caches' in window) {
              const cacheNames = await caches.keys();
              await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
            }

            try {
              window.sessionStorage.setItem(cleanupKey, 'done');
            } catch (error) {
              console.warn('Unable to persist SW cleanup state.', error);
            }

            window.location.reload();
          })
          .catch((error) => {
            console.warn('Failed to clean up stale service workers.', error);
          });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
