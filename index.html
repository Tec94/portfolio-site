<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        const isDevPort =
          window.location.port === '5173' ||
          window.location.port === '4173';

        if (window.location.hostname !== '127.0.0.1' || !isDevPort) {
          return;
        }

        const nextUrl = new URL(window.location.href);
        nextUrl.hostname = 'localhost';
        window.location.replace(nextUrl.toString());
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preload" href="/fonts/portfolio/45a619033dd926aa09d426017d7c0e347f206b40132eeb4b007201a342cdcb46.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Primary Meta Tags -->
    <title>%STUDIO_title%</title>
    <meta name="title" content="%STUDIO_title%" />
    <meta name="description" content="%STUDIO_description%" />
    <meta name="keywords" content="%STUDIO_keywords%" />
    <meta name="author" content="%STUDIO_author%" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="%STUDIO_og_type%" />
    <meta property="og:url" content="%STUDIO_og_url%" />
    <meta property="og:title" content="%STUDIO_og_title%" />
    <meta property="og:description" content="%STUDIO_og_description%" />
    <meta property="og:image" content="%STUDIO_og_image%" />

    <!-- Twitter -->
    <meta property="twitter:card" content="%STUDIO_twitter_card%" />
    <meta property="twitter:url" content="%STUDIO_twitter_url%" />
    <meta property="twitter:title" content="%STUDIO_twitter_title%" />
    <meta property="twitter:description" content="%STUDIO_twitter_description%" />
    <meta property="twitter:image" content="%STUDIO_twitter_image%" />

    <!-- Canonical URL -->
    <link rel="canonical" href="%STUDIO_canonical%" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#061019" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        const cleanupKey = 'portfolio-service-worker-cleanup-v4';

        if (!('serviceWorker' in navigator)) {
          return;
        }

        try {
          if (window.sessionStorage.getItem(cleanupKey) === 'done') {
            return;
          }
        } catch (error) {
          console.warn('Unable to read sessionStorage during SW cleanup.', error);
        }

        navigator.serviceWorker
          .getRegistrations()
          .then(async (registrations) => {
            if (registrations.length === 0) {
              try {
                window.sessionStorage.setItem(cleanupKey, 'done');
              } catch (error) {
                console.warn('Unable to persist SW cleanup state.', error);
              }
              return;
            }

            await Promise.all(registrations.map((registration) => registration.unregister()));

            if ('caches' in window) {
              const cacheNames = await caches.keys();
              await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
            }

            try {
              window.sessionStorage.setItem(cleanupKey, 'done');
            } catch (error) {
              console.warn('Unable to persist SW cleanup state.', error);
            }

            window.location.reload();
          })
          .catch((error) => {
            console.warn('Failed to clean up stale service workers.', error);
          });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
