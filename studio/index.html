<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="studio-token" content="__SESSION_TOKEN__" />
  <title>Portfolio Studio</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/__studio/style.css" />
</head>
<body>
  <div class="app" id="app">
    <aside class="rail">
      <a class="brand" href="#/projects"><span class="brand-mark">J.</span><span>Portfolio <strong>Studio</strong></span></a>
      <button type="button" class="search-trigger" id="open-palette"><span>Search everything</span><kbd>Ctrl K</kbd></button>
      <nav aria-label="Studio sections" id="navigation"></nav>
      <div class="rail-foot">
        <div class="local"><i></i> Local workspace</div>
        <a href="/" target="_blank" rel="noopener">Open portfolio ↗</a>
      </div>
    </aside>
    <aside class="list-pane" id="list" aria-label="Entries"></aside>
    <main id="main" tabindex="-1"></main>
    <aside class="inspector" id="inspector" aria-label="Inspector"></aside>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <dialog id="picker" aria-labelledby="picker-title"><div class="dialog-head"><h2 id="picker-title">Choose media</h2><button type="button" class="icon" id="close-picker" aria-label="Close media picker">×</button></div><div id="picker-content"></div></dialog>
  <dialog id="palette" class="palette" aria-label="Search everything"><input id="palette-input" type="search" placeholder="Search titles, copy, fields, or actions…" autocomplete="off" role="combobox" aria-controls="palette-results" aria-expanded="true" /><ul id="palette-results" role="listbox"></ul><p class="palette-hint"><kbd>↑</kbd><kbd>↓</kbd> move · <kbd>Enter</kbd> open · <kbd>Esc</kbd> close</p></dialog>
  <script type="module" src="/__studio/app.js"></script>
</body>
</html>
