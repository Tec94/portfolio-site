<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1002 220' width='1002' height='220'><rect width='1002' height='220' rx='10' fill='#f4efe6'/><text x='24' y='36' font-family='ui-sans-serif, system-ui, sans-serif' font-size='13' fill='#7a7064'>What the Publish button runs</text><rect x='24' y='60' width='170' height='84' rx='8' fill='none' stroke='#241f19' stroke-width='1.5'/><text x='38' y='90' font-family='ui-sans-serif, system-ui, sans-serif' font-size='16' font-weight='600' fill='#241f19'>1. Freeze</text><text x='38' y='114' font-family='ui-monospace, Consolas, monospace' font-size='11.5' fill='#7a7064'>copy saved files</text><text x='38' y='130' font-family='ui-monospace, Consolas, monospace' font-size='11.5' fill='#7a7064'>to .studio/releases</text><path d='M198 102 h16' stroke='#241f19' stroke-width='1.5'/><path d='M210 97 l6 5 l-6 5' fill='none' stroke='#241f19' stroke-width='1.5'/><rect x='220' y='60' width='170' height='84' rx='8' fill='none' stroke='#241f19' stroke-width='1.5'/><text x='234' y='90' font-family='ui-sans-serif, system-ui, sans-serif' font-size='16' font-weight='600' fill='#241f19'>2. Build</text><text x='234' y='114' font-family='ui-monospace, Consolas, monospace' font-size='11.5' fill='#7a7064'>validate content,</text><text x='234' y='130' font-family='ui-monospace, Consolas, monospace' font-size='11.5' fill='#7a7064'>then vite build</text><path d='M394 102 h16' stroke='#241f19' stroke-width='1.5'/><path d='M406 97 l6 5 l-6 5' fill='none' stroke='#241f19' stroke-width='1.5'/><rect x='416' y='60' width='170' height='84' rx='8' fill='none' stroke='#241f19' stroke-width='1.5'/><text x='430' y='90' font-family='ui-sans-serif, system-ui, sans-serif' font-size='16' font-weight='600' fill='#241f19'>3. Upload</text><text x='430' y='114' font-family='ui-monospace, Consolas, monospace' font-size='11.5' fill='#7a7064'>new media</text><text x='430' y='130' font-family='ui-monospace, Consolas, monospace' font-size='11.5' fill='#7a7064'>to R2</text><path d='M590 102 h16' stroke='#241f19' stroke-width='1.5'/><path d='M602 97 l6 5 l-6 5' fill='none' stroke='#241f19' stroke-width='1.5'/><rect x='612' y='60' width='170' height='84' rx='8' fill='none' stroke='#241f19' stroke-width='1.5'/><text x='626' y='90' font-family='ui-sans-serif, system-ui, sans-serif' font-size='16' font-weight='600' fill='#241f19'>4. Deploy</text><text x='626' y='114' font-family='ui-monospace, Consolas, monospace' font-size='11.5' fill='#7a7064'>wrangler</text><text x='626' y='130' font-family='ui-monospace, Consolas, monospace' font-size='11.5' fill='#7a7064'>pages deploy</text><path d='M786 102 h16' stroke='#241f19' stroke-width='1.5'/><path d='M798 97 l6 5 l-6 5' fill='none' stroke='#241f19' stroke-width='1.5'/><rect x='808' y='60' width='170' height='84' rx='8' fill='none' stroke='#241f19' stroke-width='1.5'/><text x='822' y='90' font-family='ui-sans-serif, system-ui, sans-serif' font-size='16' font-weight='600' fill='#241f19'>5. Verify</text><text x='822' y='114' font-family='ui-monospace, Consolas, monospace' font-size='11.5' fill='#7a7064'>fetch the</text><text x='822' y='130' font-family='ui-monospace, Consolas, monospace' font-size='11.5' fill='#7a7064'>release marker</text><path d='M305.0 144 v22' stroke='#9d2e1c' stroke-width='1.5' stroke-dasharray='4 3'/><text x='305.0' y='184' text-anchor='middle' font-family='ui-sans-serif, system-ui, sans-serif' font-size='12' fill='#9d2e1c'>build fails:</text><text x='305.0' y='200' text-anchor='middle' font-family='ui-sans-serif, system-ui, sans-serif' font-size='12' fill='#9d2e1c'>nothing uploads</text><path d='M501.0 144 v22' stroke='#9d2e1c' stroke-width='1.5' stroke-dasharray='4 3'/><text x='501.0' y='184' text-anchor='middle' font-family='ui-sans-serif, system-ui, sans-serif' font-size='12' fill='#9d2e1c'>upload fails:</text><text x='501.0' y='200' text-anchor='middle' font-family='ui-sans-serif, system-ui, sans-serif' font-size='12' fill='#9d2e1c'>nothing deploys</text></svg>